# SLAPS Linux agent - password rules (the Linux counterpart of the Windows LAPS policy).
# Changes take effect at the next check (every 5 minutes); no restart required.

# Local account whose password is rotated. root by default; use e.g. an admin account in the sudo group.
# Setting a password on a locked root account unlocks it for console and su; SSH root password logins
# stay blocked by the usual sshd default "PermitRootLogin prohibit-password".
Account=root

# Password length, 8-64.
PasswordLength=14

# 1 = upper case, 2 = + lower case, 3 = + digits, 4 = + special characters.
PasswordComplexity=4

# Maximum password age in days, 1-365.
PasswordAgeDays=30

# Optional PEM file with the CA that issued the SLAPS server's TLS certificate.
# Empty = system trust store (install the CA there, e.g. update-ca-certificates).
CaFile=
